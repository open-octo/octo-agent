<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image source</title>
<!--
  Source for og-image.png (1200×630, the card shown when octo-agent.dev is
  shared on X / Slack / Feishu / WeChat). Render it with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --force-device-scale-factor=1 \
      --virtual-time-budget=3000 \
      --screenshot=landing/og-image.png "file://$PWD/landing/og-image.src.html"

  Fonts come from landing/fonts/ so the render matches the page.
-->
<style>
  @font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;src:url(fonts/newsreader-latin.woff2) format("woff2");}
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400 800;src:url(fonts/jetbrains-mono-latin.woff2) format("woff2");}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
  body{background:#F7F3EA;color:#1C1A17;font-family:"Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;position:relative;}
  .card{position:absolute;inset:0;padding:72px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
  .top{display:flex;align-items:center;gap:20px;}
  .top .name{font-size:36px;font-weight:500;letter-spacing:-.01em;}
  .top .label{font-family:"JetBrains Mono",Menlo,monospace;font-size:15px;letter-spacing:.14em;color:#6B655B;margin-left:8px;}
  h1{margin:0;font-size:78px;line-height:1.08;font-weight:500;letter-spacing:-.02em;max-width:900px;}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid #1C1A17;padding-top:22px;}
  .bottom .label{font-family:"JetBrains Mono",Menlo,monospace;font-size:15px;letter-spacing:.14em;color:#6B655B;}
  .bottom .url{font-family:"JetBrains Mono",Menlo,monospace;font-size:15px;letter-spacing:.14em;color:#1C1A17;}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1677FF"/><path fill="#fff" d="M50 18 C34 18 26 30 26 44 C26 54 32 60 36 62 C34 70 28 78 20 82 C18 83 18 86 20 88 C22 89 25 89 27 87 C33 83 39 76 42 68 C44 69 47 70 50 70 L50 82 C50 85 53 87 56 86 C58 85 59 83 58 81 L56 70 C59 70 62 69 64 68 C67 76 73 83 79 87 C81 89 84 89 86 88 C88 86 88 83 86 82 C78 78 72 70 70 62 C74 60 80 54 80 44 C80 30 72 18 56 18 Z"/><circle cx="40" cy="42" r="5" fill="#1677FF"/><circle cx="60" cy="42" r="5" fill="#1677FF"/></svg>
    <span class="name">Octo</span>
    <span class="label">OPEN SOURCE · MIT</span>
  </div>
  <h1>Your AI agent,<br>living on your own machine.</h1>
  <div class="bottom">
    <span class="label">SELF-HOSTED · ZERO TELEMETRY · ANY MODEL · ONE GO BINARY</span>
    <span class="url">octo-agent.dev</span>
  </div>
</div>
</body>
</html>
