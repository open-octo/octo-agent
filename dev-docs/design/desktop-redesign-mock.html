        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

width:30px;height:26px;display:grid;place-items:center;border:none;background:transparent;border-radius:6px;cursor:pointer;color:var(--tx2);transition:.12s;}\n  .ptoggle:hover{color:var(--tx);}\n  .ptoggle[data-on=\"true\"]{background:var(--card);color:var(--ac);box-shadow:0 1px 2px rgba(0,0,0,.14);}\n  .row[data-on=\"true\"]{background:var(--acbg);}\n  .mtoggle{width:42px;height:25px;flex:none;border-radius:999px;border:none;background:rgba(0,0,0,.18);position:relative;cursor:pointer;transition:background .15s;padding:0;}\n  .mtoggle[data-on=\"true\"]{background:var(--ac);}\n  .mtoggle .knob{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .16s cubic-bezier(.3,.9,.4,1);}\n  .mtoggle[data-on=\"true\"] .knob{left:19px;}\n  .scat:hover{background:rgba(0,0,0,.05);}\n  .scat[data-on=\"true\"]{background:var(--acbg);}\n  .scat[data-on=\"true\"] span{color:var(--ac);font-weight:600;}\n  .scat[data-on=\"true\"] svg{color:var(--ac);}\n  .setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 16px;border-bottom:1px solid var(--bd2);}\n  .setrow:last-child{border-bottom:none;}\n  .setl{font-size:13px;color:var(--tx);}\n  .setd{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.45;max-width:42ch;}\n  .sinput{height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card);color:var(--tx);outline:none;}\n  .sinput:focus{border-color:var(--ac);}\n  .rhandle{position:absolute;left:-3px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;}\n  .rhandle:hover{background:rgba(0,122,255,.22);}\n  /* ── page primitives (secondary views) ── */\n  .pg{flex:1;overflow:auto;min-height:0;background:var(--bg);}\n  .pgi{max-width:1000px;margin:0 auto;padding:26px 28px 40px;display:flex;flex-direction:column;gap:20px;}\n  .pgi.narrow{max-width:780px;}\n  .pgh{display:flex;align-items:flex-s r:pointer;}\n  .ab:hover{background:rgba(0,0,0,.06);color:var(--tx);}\n  .ab.del:hover{background:rgba(255,59,48,.1);color:#ff3b30;}\n  .ab:disabled{opacity:.35;cursor:not-allowed;}\n  .sicon{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;background:#f0f0f2;color:var(--tx2);}\n  .kpi{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px 18px;}\n  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;}\n  .kpi .l{font-size:12px;color:var(--tx2);margin-top:2px;}\n  .seg2{display:inline-flex;padding:2px;background:rgba(0,0,0,.06);border-radius:8px;font-size:12px;}\n  .seg2 span{padding:4px 12px;border-radius:6px;color:var(--tx2);font-weight:500;cursor:pointer;}\n  .seg2 span.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12);}\n  .mono{font-family:var(--mono);}\n  .navrow[data-on=\"true\"]{background:var(--acbg);}\n  .navrow[data-on=\"true\"] .nlabel{color:var(--ac);font-weight:600;}\n  .navrow[data-on=\"true\"] svg{color:var(--ac);}\n  .mtab{padding:6px 14px;font-size:13px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;}\n  .mtab.on{color:var(--tx);font-weight:600;border-bottom-color:var(--ac);}\n  .mtab[data-on=\"true\"]{color:var(--tx);font-weight:600;border-bottom-color:var(--ac);}\n  .ostep{font-size:12px;color:var(--tx2);padding:3px 11px;border-radius:999px;background:rgba(0,0,0,.05);white-space:nowrap;}\n  .ostep[data-on=\"true\"]{background:var(--ac);color:#fff;font-weight:600;}\n  .orow{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;font-size:13px;cursor:pointer;margin-bottom:8px;background:var(--card);}\n  .orow:hover{border-color:rgba(0,0,0,.16);}\n  .orow .odot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bd);flex:none;}\n  .orow.sel{border-color:var(--ac);background:var(--acbg);}\n  .orow.sel .odot{border-color:var(--ac);background:var(--ac);box-shadow:inset 0 0 0 3px var(--card);}\n  .wctl{width:46px;align-self:stretch;border:none;background:transparent;color:var(--tx);cursor:pointer;display:grid;place-items:center;}\n  .wctl:hover{background:rgba(0,0,0,.08);}\n  .wctl.close:hover{background:#e81123;color:#fff;}\n  @keyframes lp{0%,100%{opacity:1}50%{opacity:.35}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height:100vh;padding:22px;box-sizing:border-box;display:flex\">\n<div style=\"flex:1;min-width:1120px;display:flex;flex-direction:column;background:var(--bg);border:1px solid rgba(0,0,0,.12);border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.12)\">\n\n  <!-- ══ TITLE BAR ══ -->\n  <header style=\"flex:none;height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)\">\n    <sc-if value=\"{{ isMac }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:8px;align-items:center\">\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)\"><\u002Fspan>\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#febc2e;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)\"><\u002Fspan>\n      <span style=\"width:12px;height:12px;border-radius:50%;background:#28c840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)\"><\u002Fspan>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isWin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:8px\">\n      <span style=\"width:18px;height:18px;background:var(--ac);border-radius:4px;display:grid;place-items:center\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4a5 5 0 0 0-5 5v3\"><\u002F 2-2V9z\"><\u002Fpath><path d=\"M14 3v6h6\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-family:var(--mono)\">agent-harness.md<\u002Fspan>Markdown\n        <div style=\"flex:1\"><\u002Fdiv>\n        <span style=\"font-size:11px;padding:2px 8px;background:rgba(0,0,0,.05);border-radius:6px;color:var(--tx)\">v3<\u002Fspan>刚刚\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow:auto;padding:22px 22px 30px;background:var(--card)\">\n        <div style=\"font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ac);margin-bottom:7px;font-weight:600\">技术随笔<\u002Fdiv>\n        <h3 style=\"margin:0 0 5px;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.01em\">Agent Harness：构建可靠的智能体运行时<\u002Fh3>\n        <p style=\"margin:0 0 15px;font-size:12px;color:var(--tx2)\">乔 · 2026 年 7 月 · 约 8 分钟阅读<\u002Fp>\n        <div style=\"height:1px;background:var(--bd);margin:0 0 15px\"><\u002Fdiv>\n\n        <p style=\"font-size:13px;line-height:1.75;margin:0 0 14px\">一个可靠的 <strong>Agent Harness<\u002Fstrong> 不是更聪明的模型，而是把模型放进一套可观测、可回滚、可调度的运行时里。本文拆解它的四个核心层。<\u002Fp>\n\n        <div style=\"border-left:3px solid var(--ac);background:var(--acbg);border-radius:0 8px 8px 0;padding:9px 13px;margin:0 0 15px;font-size:12px;line-height:1.6;color:#1c4e8f\">\n          <span style=\"font-size:10px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--ac);font-weight:600\">已优化 · 开头精简<\u002Fspan>\n          原「在人工智能飞速发展的今天……」冗长铺垫已删除，直接点题。\n        <\u002Fdiv>\n\n        <h4 style=\"font-size:15px;font-weight:600;margin:0 0 5px\">01 · 工具调用层<\u002Fh4>\n        <p style=\"font-size:13px;line-height:1.75;margin:0 0 14px\">每一次工具调用都应是幂等、可重放的事务。Harness 负责序列化参数、捕获输出，并在失败时按策略重试。<\u002Fp>\n        <h4 style=\"font-size:15px;font-weight:600;margin:0 0 5px\">02 · 上下文管理层<\u002Fh4>\n        <p style=\"font-size:13px;line-height:1.75;margin:0 0 14px\">当上下文接近上限时，自动压缩历史、保留关键决策，避免「越聊越傻」。<\u002Fp>\n        <h4 style=\"font-size:15px;font-weight:600;margin:0 0 5px\">03 · 调度与恢复<\u002Fh4>\n        <p style=\"font-size:13px;line-height:1.75;margin:0 0 6px\">长任务需要断点续跑。运行时把每一步落盘为可恢复的检查点：<\u002Fp>\n        <ul style=\"margin:0 0 14px;padding-left:18px;font-size:13px;line-height:1.85\">\n          <li>定时任务在后台独立进程执行<\u002Fli>\n          <li>崩溃后从最近检查点恢复<\u002Fli>\n          <li>制品统一归档，可追溯每个版本<\u002Fli>\n        <\u002Ful>\n        <h4 style=\"font-size:15px;font-weight:600;margin:0 0 5px\">04 · 可观测性<\u002Fh4>\n        <p style=\"font-size:13px;line-height:1.75;margin:0\">推理轨迹、工具耗时、token 用量全程可视，让每一次决策都可解释。<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;border-top:1px solid var(--bd);padding:11px 16px;display:flex;align-items:center;gap:8px\">\n        <button class=\"wbtn\" style=\"display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;font-weight:500;cursor:pointer;transition:.12s;font-family:inherit;box-shadow:0 1px 1.5px rgba(0,0,0,.04)\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"><\u002Fpath><\u002Fsvg>复制\n        <\u002Fbutton>\n        <button class=\"wbtn\" style=\"display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;font-weight:500;cursor:pointer;transition:.12s;font-family:inherit;box-shadow:0 1px 1.5px rgba(0,0,0,.04)\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m7 11 5 5 5-5\"><\u002Fpath><path d=\"M5 21h14\"><\u002Fpath><\u002Fsvg>导出\n        <\u00 o 操作你已登录的真实浏览器 —— 点击、输入、回放工作流。你随时可以稍后在设置里开启。<\u002Fp>\n            <div style=\"display:flex;gap:10px\"><button class=\"btnp\">开启浏览器自动化<\u002Fbutton><button class=\"btns\">稍后再说<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;padding:16px 28px;border-top:1px solid var(--bd)\">\n          <sc-if value=\"{{ obShowPrev }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btns\" sc-camel-on-click=\"{{ obPrev }}\">上一步<\u002Fbutton><\u002Fsc-if>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <sc-if value=\"{{ obNotLast }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btnp\" sc-camel-on-click=\"{{ obNext }}\">继续 →<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ obLast }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btnp\" sc-camel-on-click=\"{{ obFinish }}\">完成，开始使用<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;macOS&quot;,&quot;Windows&quot;],&quot;default&quot;:&quot;macOS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;sidebarOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showArtifact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;agentState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;空闲&quot;,&quot;运行中&quot;],&quot;default&quot;:&quot;空闲&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;backendSwitcher&quot;:{&quot;editor&qu  curAgent: 0,\n    agents: [\n      { name: \"写作助手\", handle: \"writer\", color: \"#007AFF\" },\n      { name: \"数据分析师\", handle: \"analyst\", color: \"#34c759\" },\n      { name: \"代码工程师\", handle: \"coder\", color: \"#5e5ce6\" },\n      { name: \"调研员\", handle: \"researcher\", color: \"#ff9500\" },\n    ],\n  };\n\n  componentDidUpdate(prevProps) {\n    if (this.props.sidebarOpen !== prevProps.sidebarOpen) {\n      this.setState({ showLeft: this.props.sidebarOpen ?? true });\n    }\n    if (this.props.showArtifact !== prevProps.showArtifact) {\n      this.setState({ showRight: this.props.showArtifact ?? true });\n    }\n    if (this.props.backendSwitcher !== prevProps.backendSwitcher) {\n      this.setState({ multiBackend: this.props.backendSwitcher ?? false });\n    }\n    if (this.props.showOnboard !== prevProps.showOnboard) {\n      this.setState({ onboardOpen: this.props.showOnboard ?? false, onboardStep: 0 });\n    }\n  }\n\n  startDrag = (e) => {\n    e.preventDefault();\n    const row = document.getElementById(\"octo-body-row\");\n    if (!row || !this.rightEl) return;\n    const rowW = row.getBoundingClientRect().width;\n    const startX = e.clientX;\n    const startW = this.rightEl.getBoundingClientRect().width;\n    const leftW = this.state.showLeft ? 257 : 0;\n    const minCenter = 460, minRight = 320;\n    const maxRight = Math.max(minRight, rowW - leftW - minCenter);\n    let cur = startW;\n    const move = (ev) => {\n      cur = Math.max(minRight, Math.min(maxRight, startW + (startX - ev.clientX)));\n      this.rightEl.style.width = cur + \"px\";\n    };\n    const up = () => {\n      window.removeEventListener(\"mousemove\", move);\n      window.removeEventListener(\"mouseup\", up);\n      document.body.style.cursor = \"\";\n      document.body.style.userSelect = \"\";\n      this.setState({ rightW: cur });\n    };\n    window.addEventListener(\"mousemove\", move);\n    window.addEventListener(\"mouseup\", up);\n    document.body.style.cursor = \"col-resize\";\n    document.body.style.userSelect = \"none\";\n  };\n\n  renderVals() {\n    const running = (this.props.agentState ?? \"空闲\") === \"运行中\";\n    const plat = this.props.platform ?? \"macOS\";\n    const v = this.state.view;\n    const go = (name) => () => this.setState({ view: name });\n    const nav = {\n      view: v,\n      isChat: v === \"chat\", isTasks: v === \"tasks\", isSkills: v === \"skills\",\n      isMcp: v === \"mcp\", isWorkflows: v === \"workflows\", isBrowser: v === \"browser\",\n      isChannels: v === \"channels\", isProfile: v === \"profile\", isFiles: v === \"files\",\n      isComponents: v === \"components\",\n      isAgents: v === \"agents\", isApps: v === \"apps\",\n      goAgents: go(\"agents\"), goApps: go(\"apps\"),\n      goChat: go(\"chat\"), goTasks: go(\"tasks\"), goSkills: go(\"skills\"),\n      goMcp: go(\"mcp\"), goWorkflows: go(\"workflows\"), goBrowser: go(\"browser\"),\n      goChannels: go(\"channels\"), goProfile: go(\"profile\"), goFiles: go(\"files\"),\n      goComponents: go(\"components\"),\n      showArtifactPanel: this.state.showRight && v === \"chat\",\n      memTab: this.state.memTab,\n      isSoul: this.state.memTab === \"soul\", isUser: this.state.memTab === \"user\", isMemories: this.state.memTab === \"memories\",\n      goSoul: () => this.setState({ memTab: \"soul\" }),\n      goUser: () => this.setState({ memTab: \"user\" }),\n      goMemories: () => this.setState({ memTab: \"memories\" }),\n    };\n    const dot = (s) => (s === \"online\" ? \"#34c759\" : s === \"slow\" ? \"#febc2e\" : \"#c7ccd6\");\n    const statusLabel = (s) => (s === \"online\" ? \"已连接\" : s === \"slow\" ? \"高延迟\" : \"离线\");\n    const backends = this.state.backends.map((b, i) => ({\n      ...b,\n      selected: i === this.state.curBackend,\n      dotColor: dot(b.status),\n      statusLabel: statusLabel(b.status),\n      onSelect: () => this.setState({ curBackend: i, backendOpen: false }),\n    }));\n    const cb = this.state.backends[this.state.curBackend];\n    const agents = this.state.agents.map((a, i) => ({\n      ...a,\n      initial: a.name.slice(0, 1),\n      selected: i === this.state.curAgent,\n      onSelect: () => this.setState({ curAgent: i, agentOpen: false }),\n    }));\n    const ca = this.state.agents[this.state.curAgent];\n    return {\n      showLeft: this.state.showLeft,\n      showCenter: this.state.showCenter,\n      showRight: this.state.showRight,\n      leftOn: this.state.showLeft,\n      centerOn: this.state.showCenter,\n      rightOn: this.state.showRight,\n      toggleLeft: () => this.setState((s) => ({ showLeft: !s.showLeft })),\n      toggleCenter: () => this.setState((s) => ({ showCenter: !s.showCenter })),\n      toggleRight: () => this.setState((s) => ({ showRight: !s.showRight })),\n      rightRef: (el) => { this.rightEl = el; if (el) el.style.width = (this.state.rightW || 404) + \"px\"; },\n      startDrag: this.startDrag,\n      showSwitcher: this.state.multiBackend,\n      hideSwitcher: !this.state.multiBackend,\n      settingsOpen: this.state.settingsOpen,\n      openSettings: () => this.setState({ settingsOpen: true }),\n      closeSettings: () => this.setState({ settingsOpen: false }),\n      settingsCat: this.state.settingsCat,\n      catGeneral: this.state.settingsCat === \"general\",\n      catEndpoints: this.state.settingsCat === \"endpoints\",\n      catConnect: this.state.settingsCat === \"connect\",\n      catAgent: this.state.settingsCat === \"agent\",\n      catMobile: this.state.settingsCat === \"mobile\",\n      catAbout: this.state.settingsCat === \"about\",\n      goGeneral: () => this.setState({ settingsCat: \"general\" }),\n      goEndpoints: () => this.setState({ settingsCat: \"endpoints\" }),\n      goConnect: () => this.setState({ settingsCat: \"connect\" }),\n      goAgent: () => this.setState({ settingsCat: \"agent\" }),\n      goMobile: () => this.setState({ settingsCat: \"mobile\" }),\n      goAbout: () => this.setState({ settingsCat: \"about\" }),\n      catTitle: { general: \"常规\", endpoints: \"端点\", connect: \"连接\", agent: \"助手默认值\", mobile: \"手机\", about: \"关于\" }[this.state.settingsCat],\n      epModalOpen: this.state.epModalOpen,\n      epTitle: this.state.epEditing ? \"编辑端点\" : \"添加端点\",\n      epEditing: this.state.epEditing,\n      epAdding: !this.state.epEditing,\n      openAddEp: () => this.setState({ epModalOpen: true, epEditing: false }),\n      openEditEp: () => this.setState({ epModalOpen: true, epEditing: true }),\n      closeEp: () => this.setState({ epModalOpen: false }),\n      modelModalOpen: this.state.modelModalOpen,\n      modelVision: this.state.modelVision,\n      openAddModel: () => this.setState({ modelModalOpen: true, modelVision: false }),\n      closeModel: () => this.setState({ modelModalOpen: false }),\n      toggleModelVision: () => this.setState((s) => ({ modelVision: !s.modelVision })),\n      onboardOpen: this.state.onboardOpen,\n      ob0: this.state.onboardStep === 0,\n      ob1: this.state.onboardStep === 1,\n      ob2: this.state.onboardStep === 2,\n      obShowPrev: this.state.onboardStep > 0,\n      obLast: this.state.onboardStep === 2,\n      obNotLast: this.state.onboardStep < 2,\n      openOnboard: () => this.setState({ onboardOpen: true, onboardStep: 0 }),\n      obNext: () => this.setState((s) => ({ onboardStep: Math.min(2, s.onboardStep + 1) })),\n      obPrev: () => this.setState((s) => ({ onboardStep: Math.max(0, s.onboardStep - 1) })),\n      obFinish: () => this.setState({ onboardOpen: false, onboardStep: 0 }),\n      stop: (e) => e.stopPropagation(),\n      multiBackend: this.state.multiBackend,\n      toggleMultiBackend: () => this.setState((s) => ({ multiBackend: !s.multiBackend })),\n      backendOpen: this.state.backendOpen,\n      toggleBackend: () => this.setState((s) => ({ backendOpen: !s.backendOpen })),\n      closeBackend: () => this.setState({ backendOpen: false }),\n      backends,\n      curBackendName: cb.name,\n      curBackendHost: cb.host,\n      curBackendDot: dot(cb.status),\n      backendLocal: cb.kind === \"local\",\n      backendRemote: cb.kind === \"remote\",\n      modelOpen: this.state.modelOpen,\n      toggleModel: () => this.setState((s) => ({ modelOpen: !s.modelOpen })),\n      closeModel: () => this.setState({ modelOpen: false }),\n      curModelName: this.state.modelList[this.state.curModel].name,\n      modelGroups: (() => {\n        const out = [];\n        this.state.modelList.forEach((m, i) => {\n          let g = out.find((x) => x.endpoint === m.endpoint);\n          if (!g) { g = { endpoint: m.endpoint, host: m.host, dot: m.dot, items: [] }; out.push(g); }\n          g.items.push({\n            name: m.name, note: m.note,\n            selected: i === this.state.curModel,\n            onSelect: () => this.setState({ curModel: i, modelOpen: false }),\n          });\n        });\n        return out;\n      })(),\n      agentOpen: this.state.agentOpen,\n      toggleAgent: () => this.setState((s) => ({ agentOpen: !s.agentOpen })),\n      closeAgent: () => this.setState({ agentOpen: false }),\n      agents,\n      curAgentName: ca.name,\n      running,\n      idle: !running,\n      isMac: plat === \"macOS\",\n      isWin: plat !== \"macOS\",\n      ...nav,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
